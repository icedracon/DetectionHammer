<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" role="img" aria-labelledby="t d">
<title id="t">DetectionHammer evidence loop</title><desc id="d">Five defensive review stages with animated data flow: scope, observe, correlate, challenge, qualify.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0B0814"/><stop offset="1" stop-color="#251344"/></linearGradient><radialGradient id="glow"><stop stop-color="#A855F7" stop-opacity=".28"/><stop offset="1" stop-color="#A855F7" stop-opacity="0"/></radialGradient><style>text{font-family:system-ui,sans-serif}.flow{stroke-dasharray:6 10;animation:flow 2.4s linear infinite}.dot{animation:pulse 3s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-64}}@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.flow,.dot{animation:none}}</style></defs><rect width="1200" height="230" rx="16" fill="url(#bg)"/><ellipse cx="600" cy="104" rx="610" ry="126" fill="url(#glow)"/><text x="28" y="33" fill="#E9D5FF" font-size="12" letter-spacing="2">DETECTIONHAMMER / EVIDENCE LOOP</text><path d="M230 115H259" class="flow" fill="none" stroke="#D8B4FE" stroke-width="2"/><g transform="translate(28 62)"><rect width="202" height="106" rx="11" fill="#1D1234" stroke="#7C3AED"/><path d="M19 25L31 18 43 25 31 32Z" fill="#A855F7" stroke="#E9D5FF"/><circle cx="31" cy="25" r="3" fill="#F3E8FF" class="dot" style="animation-delay:-0.0s"/><text x="19" y="56" fill="#F3E8FF" font-size="17" font-weight="700">SCOPE</text><text x="19" y="78" fill="#C4B5FD" font-size="12">Authorized context</text></g><path d="M461 115H490" class="flow" fill="none" stroke="#D8B4FE" stroke-width="2"/><g transform="translate(259 62)"><rect width="202" height="106" rx="11" fill="#1D1234" stroke="#7C3AED"/><path d="M19 25L31 18 43 25 31 32Z" fill="#A855F7" stroke="#E9D5FF"/><circle cx="31" cy="25" r="3" fill="#F3E8FF" class="dot" style="animation-delay:-0.4s"/><text x="19" y="56" fill="#F3E8FF" font-size="17" font-weight="700">OBSERVE</text><text x="19" y="78" fill="#C4B5FD" font-size="12">Raw evidence</text></g><path d="M692 115H721" class="flow" fill="none" stroke="#D8B4FE" stroke-width="2"/><g transform="translate(490 62)"><rect width="202" height="106" rx="11" fill="#1D1234" stroke="#7C3AED"/><path d="M19 25L31 18 43 25 31 32Z" fill="#A855F7" stroke="#E9D5FF"/><circle cx="31" cy="25" r="3" fill="#F3E8FF" class="dot" style="animation-delay:-0.8s"/><text x="19" y="56" fill="#F3E8FF" font-size="17" font-weight="700">CORRELATE</text><text x="19" y="78" fill="#C4B5FD" font-size="12">Source + time</text></g><path d="M923 115H952" class="flow" fill="none" stroke="#D8B4FE" stroke-width="2"/><g transform="translate(721 62)"><rect width="202" height="106" rx="11" fill="#1D1234" stroke="#7C3AED"/><path d="M19 25L31 18 43 25 31 32Z" fill="#A855F7" stroke="#E9D5FF"/><circle cx="31" cy="25" r="3" fill="#F3E8FF" class="dot" style="animation-delay:-1.2000000000000002s"/><text x="19" y="56" fill="#F3E8FF" font-size="17" font-weight="700">CHALLENGE</text><text x="19" y="78" fill="#C4B5FD" font-size="12">Negative controls</text></g><g transform="translate(952 62)"><rect width="202" height="106" rx="11" fill="#1D1234" stroke="#7C3AED"/><path d="M19 25L31 18 43 25 31 32Z" fill="#A855F7" stroke="#E9D5FF"/><circle cx="31" cy="25" r="3" fill="#F3E8FF" class="dot" style="animation-delay:-1.6s"/><text x="19" y="56" fill="#F3E8FF" font-size="17" font-weight="700">QUALIFY</text><text x="19" y="78" fill="#C4B5FD" font-size="12">Evidence-led report</text></g><text x="28" y="206" fill="#C4B5FD" font-size="12">Conceptual workflow / no live telemetry / no attack execution</text></svg>
