<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
<title id="title">DetectionHammer — prove what your defenses see</title>
<desc id="desc">Animated isometric Active Directory detection architecture with identity, telemetry and evidence layers. Concept illustration, not live data.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#08111b"/><stop offset="1" stop-color="#101e2b"/></linearGradient>
  <linearGradient id="top" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#214b55"/><stop offset="1" stop-color="#152a39"/></linearGradient>
  <linearGradient id="left" x2="0" y2="1"><stop stop-color="#142c38"/><stop offset="1" stop-color="#0b1a28"/></linearGradient>
  <linearGradient id="right" x2="1" y2="1"><stop stop-color="#102532"/><stop offset="1" stop-color="#173641"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#3cdab3" stop-opacity=".16"/><stop offset="1" stop-color="#3cdab3" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#8eb5c3" stroke-opacity=".065"/></pattern>
  <style>
    text{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
    .signal{stroke-dasharray:5 13;animation:flow 3s linear infinite}
    .reverse{animation-direction:reverse;animation-duration:4s}
    .pulse{animation:pulse 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .delay{animation-delay:-1.4s}
    .scan{animation:scan 4s ease-in-out infinite}
    @keyframes flow{to{stroke-dashoffset:-72}}
    @keyframes pulse{0%,100%{opacity:.42}50%{opacity:1}}
    @keyframes scan{0%,100%{transform:translateY(-12px);opacity:.28}50%{transform:translateY(12px);opacity:.95}}
    @media(prefers-reduced-motion:reduce){.signal,.pulse,.scan{animation:none!important}}
  </style>
</defs>
<rect width="1200" height="480" rx="20" fill="url(#bg)"/>
<rect x="1" y="1" width="1198" height="478" rx="19" fill="url(#grid)" stroke="#34525c" stroke-opacity=".7"/>
<ellipse cx="893" cy="244" rx="325" ry="218" fill="url(#halo)"/>
<g fill="none" stroke="#36515f" stroke-opacity=".5">
<path d="M609 326 882 167 1155 326 882 466Z"/>
<path d="M654 352 927 193 M700 378 973 219 M746 404 1019 245 M792 430 1065 271 M838 456 1111 297"/>
<path d="M654 300 927 440 M700 274 973 414 M746 248 1019 388 M792 222 1065 362 M838 196 1111 336"/>
</g>
<!-- Brand -->
<g transform="translate(54 50)">
  <path d="M0 0H36V12L18 25 0 12Z" fill="#5ce2bf" fill-opacity=".15" stroke="#5ce2bf"/>
  <path d="M8 6H28L18 17Z" fill="#5ce2bf"/>
  <text x="49" y="15" fill="#a8c6c9" font-size="13" font-weight="650" letter-spacing="2.2">ICEDRACON / SECURITY TOOLS</text>
</g>
<text x="54" y="144" fill="#eff7fa" font-size="57" font-weight="760" letter-spacing="-2">DetectionHammer</text>
<text x="57" y="183" fill="#5ce2bf" font-size="20" font-weight="600" letter-spacing="2">ACTIVE DIRECTORY DEFENSIVE VALIDATION</text>
<text x="56" y="242" fill="#f2f6f8" font-size="31" font-weight="600" letter-spacing="-.6">Prove what your</text>
<text x="56" y="279" fill="#f2f6f8" font-size="31" font-weight="600" letter-spacing="-.6">defenses can see.</text>
<text x="57" y="318" fill="#a4bac5" font-size="16">Portable AI skill for Claude Code and Codex</text>
<g transform="translate(55 353)">
  <rect width="139" height="48" rx="7" fill="#132531" stroke="#35555d"/>
  <text x="12" y="22" fill="#e7f4f3" font-size="19" font-weight="700">150</text><text x="12" y="38" fill="#9ab2ba" font-size="11">SCENARIO CARDS</text>
  <g transform="translate(151)"><rect width="139" height="48" rx="7" fill="#132531" stroke="#35555d"/><text x="12" y="22" fill="#e7f4f3" font-size="19" font-weight="700">12</text><text x="12" y="38" fill="#9ab2ba" font-size="11">AD SECURITY DOMAINS</text></g>
  <g transform="translate(302)"><rect width="139" height="48" rx="7" fill="#132531" stroke="#35555d"/><text x="12" y="22" fill="#5ce2bf" font-size="16" font-weight="700">PREVIEW</text><text x="12" y="38" fill="#9ab2ba" font-size="11">EVIDENCE-FIRST</text></g>
</g>
<text x="56" y="443" fill="#92aab4" font-size="11" letter-spacing="1.2" class="mono">AUTHORIZED LABS  /  DEFENSIVE REVIEW  /  NO LIVE COVERAGE CLAIM</text>
<!-- Three isometric platforms -->
<g stroke-linejoin="round" stroke-width="1.5">
  <path d="M718 337 880 245 1042 337 880 429Z" fill="#122731" stroke="#37606a"/>
  <path d="M718 337 880 429 880 442 718 350Z" fill="#0a1824" stroke="#37606a"/>
  <path d="M1042 337 880 429 880 442 1042 350Z" fill="#15313a" stroke="#37606a"/>
  <path d="M728 254 880 168 1032 254 880 340Z" fill="url(#top)" stroke="#4c8589"/>
  <path d="M728 254 880 340 880 354 728 268Z" fill="url(#left)" stroke="#4c8589"/>
  <path d="M1032 254 880 340 880 354 1032 268Z" fill="url(#right)" stroke="#4c8589"/>
  <path d="M738 171 880 91 1022 171 880 251Z" fill="url(#top)" stroke="#5ce2bf" stroke-opacity=".85"/>
  <path d="M738 171 880 251 880 265 738 185Z" fill="url(#left)" stroke="#4f8b89"/>
  <path d="M1022 171 880 251 880 265 1022 185Z" fill="url(#right)" stroke="#4f8b89"/>
</g>
<!-- Tower core: a translucent inspection chamber -->
<g stroke-linejoin="round">
  <path d="M830 111 880 83 930 111 880 139Z" fill="#367e7d" fill-opacity=".65" stroke="#75f0ce" stroke-width="1.4"/>
  <path d="M830 111 880 139 880 210 830 182Z" fill="#122c37" stroke="#5ce2bf" stroke-opacity=".8"/>
  <path d="M930 111 880 139 880 210 930 182Z" fill="#23524f" fill-opacity=".9" stroke="#5ce2bf" stroke-opacity=".8"/>
  <path class="scan" d="M836 146 880 171 924 146 880 121Z" fill="#5ce2bf" fill-opacity=".18" stroke="#5ce2bf" stroke-width="1.4"/>
  <path d="M847 133 871 147 M847 145 871 159 M847 157 871 171" stroke="#6edac3" stroke-opacity=".6" stroke-width="2"/>
  <path d="M890 151 919 135 M890 163 919 147 M890 175 919 159" stroke="#8be7cf" stroke-opacity=".5" stroke-width="2"/>
</g>
<!-- projected signal connectors -->
<g fill="none" stroke-linecap="round" stroke-width="2">
  <path d="M880 265V332 M880 354V414" stroke="#3b696e" stroke-dasharray="2 7"/>
  <path d="M880 265V332 M880 354V414" stroke="#68e6c2" class="signal"/>
  <path d="M880 170 797 217 797 269 711 318" stroke="#4f9091" opacity=".8"/>
  <path d="M880 170 797 217 797 269 711 318" stroke="#7debc9" class="signal"/>
  <path d="M880 170 961 217 961 269 1049 318" stroke="#4f9091" opacity=".8"/>
  <path d="M880 170 961 217 961 269 1049 318" stroke="#7debc9" class="signal reverse"/>
</g>
<g>
  <circle cx="711" cy="318" r="12" fill="#5ce2bf" fill-opacity=".12" stroke="#5ce2bf" class="pulse"/>
  <circle cx="711" cy="318" r="3.5" fill="#86f5d7"/>
  <circle cx="1049" cy="318" r="12" fill="#5ce2bf" fill-opacity=".12" stroke="#5ce2bf" class="pulse delay"/>
  <circle cx="1049" cy="318" r="3.5" fill="#86f5d7"/>
</g>
<!-- Layer labels -->
<g font-size="11" class="mono" letter-spacing=".8">
  <path d="M1024 170H1064V139H1151" fill="none" stroke="#648b94"/>
  <circle cx="1024" cy="170" r="3" fill="#5ce2bf"/>
  <text x="1151" y="130" text-anchor="end" fill="#cde5e6">01 / IDENTITY</text>
  <path d="M1033 253H1072V232H1151" fill="none" stroke="#648b94"/>
  <circle cx="1033" cy="253" r="3" fill="#5ce2bf"/>
  <text x="1151" y="222" text-anchor="end" fill="#cde5e6">02 / TELEMETRY</text>
  <path d="M1049 338H1077V362H1151" fill="none" stroke="#648b94"/>
  <circle cx="1049" cy="338" r="3" fill="#5ce2bf"/>
  <text x="1151" y="378" text-anchor="end" fill="#cde5e6">03 / EVIDENCE</text>
</g>
<g transform="translate(706 55)"><circle cx="0" cy="0" r="4" fill="#5ce2bf" class="pulse"/><text x="12" y="4" fill="#a4bac5" font-size="11" class="mono" letter-spacing="1.2">CONCEPT VISUALIZATION</text></g>
</svg>