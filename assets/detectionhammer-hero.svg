<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
<title id="title">DetectionHammer — prove what your defenses see</title>
<desc id="desc">Animated isometric Active Directory detection architecture with identity, telemetry and evidence layers. Concept illustration, not live data.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10091c"/><stop offset="1" stop-color="#211334"/></linearGradient>
  <linearGradient id="top" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#532681"/><stop offset="1" stop-color="#2a1648"/></linearGradient>
  <linearGradient id="left" x2="0" y2="1"><stop stop-color="#28163e"/><stop offset="1" stop-color="#180f2a"/></linearGradient>
  <linearGradient id="right" x2="1" y2="1"><stop stop-color="#251537"/><stop offset="1" stop-color="#44235f"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#a855f7" stop-opacity=".16"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#c7b3ed" stroke-opacity=".065"/></pattern>
  <style>
    text{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
    .signal{stroke-dasharray:5 13;animation:flow 3s linear infinite}
    .reverse{animation-direction:reverse;animation-duration:4s}
    .pulse{animation:pulse 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .delay{animation-delay:-1.4s}
    .scan{animation:scan 4s ease-in-out infinite}
    .ring{transform-origin:880px 171px;animation:rotate 20s linear infinite}
    .spark{animation:pulse 2.4s ease-in-out infinite}
    .comet{stroke-dasharray:10 160;animation:flow 6s linear infinite}
    @keyframes rotate{to{transform:rotate(360deg)}}
    @keyframes flow{to{stroke-dashoffset:-340}}
    @keyframes pulse{0%,100%{opacity:.42}50%{opacity:1}}
    @keyframes scan{0%,100%{transform:translateY(-12px);opacity:.28}50%{transform:translateY(12px);opacity:.95}}
    @media(prefers-reduced-motion:reduce){.signal,.pulse,.scan,.ring,.spark,.comet{animation:none!important}}
  </style>
</defs>
<rect width="1200" height="480" rx="20" fill="url(#bg)"/>
<rect x="1" y="1" width="1198" height="478" rx="19" fill="url(#grid)" stroke="#63438a" stroke-opacity=".7"/>
<ellipse cx="893" cy="244" rx="325" ry="218" fill="url(#halo)"/>
<g fill="none" stroke="#513c72" stroke-opacity=".5">
<path d="M609 326 882 167 1155 326 882 466Z"/>
<path d="M654 352 927 193 M700 378 973 219 M746 404 1019 245 M792 430 1065 271 M838 456 1111 297"/>
<path d="M654 300 927 440 M700 274 973 414 M746 248 1019 388 M792 222 1065 362 M838 196 1111 336"/>
</g>
<!-- Brand -->
<g transform="translate(54 50)">
  <path d="M0 0H36V12L18 25 0 12Z" fill="#d8a0ff" fill-opacity=".15" stroke="#d8a0ff"/>
  <path d="M8 6H28L18 17Z" fill="#d8a0ff"/>
  <text x="49" y="15" fill="#d1bbe9" font-size="13" font-weight="650" letter-spacing="2.2">ICEDRACON / SECURITY TOOLS</text>
</g>
<text x="54" y="144" fill="#eff7fa" font-size="57" font-weight="760" letter-spacing="-2">DetectionHammer</text>
<text x="57" y="183" fill="#d8a0ff" font-size="20" font-weight="600" letter-spacing="2">ACTIVE DIRECTORY DEFENSIVE VALIDATION</text>
<text x="56" y="242" fill="#f2f6f8" font-size="31" font-weight="600" letter-spacing="-.6">Prove what your</text>
<text x="56" y="279" fill="#f2f6f8" font-size="31" font-weight="600" letter-spacing="-.6">defenses can see.</text>
<text x="57" y="318" fill="#bfb1d4" font-size="16">Portable AI skill for Claude Code and Codex</text>
<g transform="translate(55 353)">
  <rect width="139" height="48" rx="7" fill="#211635" stroke="#644489"/>
  <text x="12" y="22" fill="#e7f4f3" font-size="19" font-weight="700">150</text><text x="12" y="38" fill="#bda9d5" font-size="11">SCENARIO CARDS</text>
  <g transform="translate(151)"><rect width="139" height="48" rx="7" fill="#211635" stroke="#644489"/><text x="12" y="22" fill="#e7f4f3" font-size="19" font-weight="700">12</text><text x="12" y="38" fill="#bda9d5" font-size="11">AD SECURITY DOMAINS</text></g>
  <g transform="translate(302)"><rect width="139" height="48" rx="7" fill="#211635" stroke="#644489"/><text x="12" y="22" fill="#d8a0ff" font-size="16" font-weight="700">PREVIEW</text><text x="12" y="38" fill="#bda9d5" font-size="11">EVIDENCE-FIRST</text></g>
</g>
<text x="56" y="443" fill="#b6a0d1" font-size="11" letter-spacing="1.2" class="mono">AUTHORIZED LABS  /  DEFENSIVE REVIEW  /  NO LIVE COVERAGE CLAIM</text>
<!-- Three isometric platforms -->
