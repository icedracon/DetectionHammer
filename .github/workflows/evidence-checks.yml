name: Evidence checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python skills/detectionhammer-ad/scripts/dh_review.py validate
      - run: python skills/detectionhammer-ad/scripts/dh_review.py fixtures
      - run: python skills/detectionhammer-ad/scripts/evidence_review.py examples/evidence.json
