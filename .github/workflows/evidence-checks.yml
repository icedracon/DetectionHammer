name: Evidence checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python skills/detectionhammer-ad/scripts/evidence_review.py skills/detectionhammer-ad/examples/partial-search.json
